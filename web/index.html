<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carga Certa</title>
<meta name="theme-color" content="#0C5B39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carga Certa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Layout: green header panel with a two-tone title, light cards with a tinted person panel, fixed tab bar. Palette follows the building's green identity. */
  --bg:#F5F8F3; --surface:#FFFFFF; --ink:#12281D; --muted:#5C7064; --line:#E1E9DD; --soft:#E6F2E1;
  --hdr:#0C5B39; --lime:#8DC63F; --brand:#0C5B39; --on-brand:#FFFFFF; --cell:#2E9B57;
  --good-bg:#DFF2E3; --good-ink:#0B6B3A;
  --warn-bg:#FCEFCF; --warn-ink:#7A5200;
  --bad:#C23B30; --bad-bg:#F9DEDA; --bad-ink:#9A2A21;
  --plate:#1B4FB8;
  --f:'Montserrat','Trebuchet MS',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1710; --surface:#10261A; --ink:#E7F2E9; --muted:#93AB9B; --line:#1E3A2A; --soft:#16331F;
  --hdr:#0F3B25; --lime:#8DC63F; --brand:#8DC63F; --on-brand:#0A2514; --cell:#4FC27D;
  --good-bg:#12392A; --good-ink:#7CE9A8;
  --warn-bg:#3A2D08; --warn-ink:#F7CB5A;
  --bad:#FF7A70; --bad-bg:#451C19; --bad-ink:#FFA59E;
  --plate:#5B8CF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1710; --surface:#10261A; --ink:#E7F2E9; --muted:#93AB9B; --line:#1E3A2A; --soft:#16331F;
  --hdr:#0F3B25; --lime:#8DC63F; --brand:#8DC63F; --on-brand:#0A2514; --cell:#4FC27D;
  --good-bg:#12392A; --good-ink:#7CE9A8;
  --warn-bg:#3A2D08; --warn-ink:#F7CB5A;
  --bad:#FF7A70; --bad-bg:#451C19; --bad-ink:#FFA59E;
  --plate:#5B8CF0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;
  padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}

/* header */
.hero{background:var(--hdr);color:#fff;border-radius:28px;padding:16px 18px 24px;box-shadow:inset 0 -6px 0 var(--lime);display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--lime);color:#0A3A22;display:grid;place-items:center}
.logo.img{background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.lg{width:44px;height:44px}
.brand .bn{display:flex;flex-direction:column;line-height:1.15}
.brand .bn small{font-size:11px;font-weight:600;opacity:.85}
.role{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.role[hidden]{display:none}
.role button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer}
.role button[aria-pressed="true"]{background:#fff;color:#0A3A22}
.hero h1{font-size:25px;font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero p{margin-top:6px;color:var(--lime);font-weight:700;font-size:14px}

/* buttons, pills */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{border-color:var(--bad);color:var(--bad-ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pill{font-size:12px;font-weight:700;padding:3px 11px;border-radius:8px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.pill.idle{background:var(--soft);color:var(--muted)}

/* cards */
.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctop h3{font-size:18px;font-weight:800}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big .lbl{display:block;font-size:12px;color:var(--muted);font-weight:500}
.big b{font-family:var(--f-mono);font-size:36px;font-weight:500;line-height:1.1}
.cnt{font-size:14px;color:var(--muted);padding-bottom:6px}
.cnt.bad{color:var(--bad-ink);font-weight:500}
.cells{display:block}
.cell{flex:1;height:18px;border-radius:4px;background:var(--soft)}
.cell.on{background:var(--cell)}
.cell.live{background:var(--cell);opacity:.45;animation:pulse 1.6s ease-in-out infinite}
.cells.late .cell.on{background:var(--bad)}
@keyframes pulse{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cell.live{animation:none}}
.panel{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pi{min-width:0;display:flex;flex-direction:column}
.pi b{font-size:14px;font-weight:700}
.pi span{font-size:12px;color:var(--muted)}
.plate{display:inline-block;position:relative;flex:none;background:var(--surface);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;border:1.5px solid var(--ink);border-radius:5px;padding:5px 7px 2px;line-height:1.1;overflow:hidden}
.plate i{position:absolute;left:0;right:0;top:0;height:4px;background:var(--plate)}
.you,.pi span.you,.l span.you{display:inline-block;font-size:10px;font-weight:800;line-height:1.5;background:var(--lime);color:#0A3A22;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.free{font-weight:500;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.banner{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.banner b{font-size:15px;font-weight:800}
.banner.good{background:var(--good-bg);color:var(--good-ink)}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 18px}
.item,.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child,.qrow:first-child{border-top:0}
.l{min-width:0;display:flex;flex-direction:column}
.l b{font-weight:700}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qn{font-family:var(--f-mono);font-size:24px;color:var(--brand);width:30px;flex:none}
.qrow .l{flex:1}
.qrow.me{background:var(--soft);margin:0 -18px;padding:14px 18px}
.eta{text-align:right;font-family:var(--f-mono);font-size:15px}
.eta small{display:block;font-family:var(--f);font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.sh{font-size:15px;font-weight:800;margin:22px 0 10px}
.sw{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:10px}
.sw button{flex:none;width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw button[aria-checked="true"]{background:var(--cell)}
.sw button[aria-checked="true"]::after{transform:translateX(20px)}
.tag{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.demo{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.demo button{border:1px dashed var(--muted);background:none;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:480px;margin:0 auto;display:flex;gap:4px}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;min-height:52px}
nav button[aria-current="page"]{color:var(--brand);background:var(--soft)}
nav svg{width:22px;height:22px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:40}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(6,20,12,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px;font-weight:800}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.pts,.timein,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700}
.opt small{font-weight:400;color:var(--muted)}
.opt input:checked + span{border-color:var(--brand);background:var(--soft)}
.opt input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.opt.off{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;font-size:17px;color:var(--ink);min-height:48px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.endprev{background:var(--soft);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column}
.endprev b{font-family:var(--f-mono);font-size:32px;font-weight:500;color:var(--brand)}
.err{color:var(--bad-ink);font-size:12px;min-height:16px}
.panel{flex-wrap:wrap}
.ph{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.lnk{border:0;background:none;padding:2px 0;text-align:left;font-size:12px;color:var(--brand);text-decoration:underline dotted;cursor:pointer;width:max-content;min-height:28px}
nav button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;display:grid;place-items:center;padding:0 5px}
.opts1{display:grid;grid-template-columns:1fr;gap:8px}
.opt.wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.banner .lnk{color:inherit;font-weight:700;margin-top:4px}
.phr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
a.lnk{text-decoration:none;font-weight:700;display:inline-flex;align-items:center;min-height:28px}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrimg{background:#fff;border-radius:12px;padding:6px;width:100%;max-width:150px;aspect-ratio:1}
.qrimg svg{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.hb{fill:var(--muted);opacity:.35}
.hb.pk{fill:var(--cell);opacity:1}
.trk{height:24px;border-radius:999px;background:var(--soft);overflow:hidden}
.fill{height:100%;min-width:24px;border-radius:999px;background:var(--cell);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;transition:width .6s ease}
.fill svg{width:18px;height:18px;flex:none;animation:zap 1.8s ease-in-out infinite}
.cells.late .fill{background:var(--bad)}
.cells.late .fill svg{animation:none}
.pct{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}
@keyframes zap{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.fill svg{animation:none}.fill{transition:none}}

/* extras do app real */
input[type=email],input[type=tel],input[type=password],textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;font-size:17px;color:var(--ink);min-height:48px;font-family:inherit}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:none;width:auto;max-width:min(448px,calc(100vw - 32px));box-sizing:border-box;overflow-wrap:anywhere;word-break:normal;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast[hidden],#modal[hidden],#auth[hidden],#app[hidden],#tabbar[hidden]{display:none}
#auth .stack{margin-top:16px}
.hero h1{font-size:24px;font-weight:800;line-height:1.2}
.hero p{opacity:.85;margin-top:4px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.chart .hb{fill:var(--line)}.chart .hb.pk{fill:var(--cell)}
@media print{
  nav,#tabbar,.demo,.role,.btn,#toast,#modal{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .hero{box-shadow:none;border:1px solid #999;color:#000;background:#fff}
  .card,.list{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="auth" hidden></div>
  <div id="app" hidden>
    <header class="hero">
      <div class="top">
        <div class="brand"><span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.8h-5.7z"/></svg></span>Carga Certa</div>
        <div class="role" hidden><button data-act="role" data-id="morador" aria-pressed="true">Morador</button><button data-act="role" data-id="sindico" aria-pressed="false">Síndico</button></div>
      </div>
      <div><h1 id="ttl"></h1><p id="sub"></p></div>
    </header>
    <main id="view" class="stack" style="margin-top:16px"></main>
  </div>
</div>
<nav id="tabbar" hidden><div class="in" id="tabs"></div></nav>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
